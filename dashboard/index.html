<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todo Motorhome – Dashboard</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1>Todo Motorhome · Métricas</h1>
    <div id="updated" class="muted">Cargando…</div>
  </div>
  <div class="range">
    <div class="presets" id="presets"></div>
    <div class="dates">
      <label><span>Fecha de inicio</span><input type="date" id="start"></label>
      <span class="dash">—</span>
      <label><span>Fecha de fin</span><input type="date" id="end"></label>
    </div>
    <div class="muted small" id="cmpLabel"></div>
  </div>
</header>
<main>
  <section class="block"><h2>Sharetribe</h2><div class="cards" id="cards-st"></div><div class="charts" id="charts-st"></div></section>
  <section class="block"><h2>Redes sociales</h2><div class="cards" id="cards-social"></div><div class="charts" id="charts-social"></div></section>
  <section class="block"><h2>Censo Rodantero</h2><div class="cards" id="cards-censo"></div><div class="charts" id="charts-censo"></div></section>
  <section class="block"><h2>Email (Mailjet)</h2><div class="cards" id="cards-mj"></div><div class="charts" id="charts-mj"></div><div id="mj-table"></div></section>
  <section class="block"><h2>Google Analytics</h2><div class="cards" id="cards-ga"></div><div class="charts" id="charts-ga"></div></section>
  <footer class="muted small" id="notes"></footer>
</main>
<script src="assets/app.js"></script>
</body>
</html>
